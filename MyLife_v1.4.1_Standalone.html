function formatClock(seconds){seconds=Math.max(0,Math.floor(Number(seconds)||0));const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=seconds%60;return h>0?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function sessionRow(x){const t=state.tasks.find(q=>q.id===x.taskId),st=t?.subtasks?.find(q=>q.id===x.subtaskId);return `<div class="session-row"><div><strong>${esc(t?.title||'کار حذف‌شده')}</strong><span>${st?`خرده‌کار: ${esc(st.title)} · `:''}${timerModeFa(x.mode)} · ${faShortDateTime(x.endedAt)}</span></div><b>${fmtMin((Number(x.durationSeconds)||0)/60)}</b><button class="subtask-remove" data-delete-session="${x.id}" title="حذف جلسه">×</button></div>`}
function notifyUser(title,body){toast(body||title,'good');try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body})}catch{}}
function startTimer(mode=focusMode,phase='focus'){
  if(state.activeTimer)return; const taskId=phase==='break'?'':focusTaskId; if(phase==='focus'&&!taskId){toast('ابتدا یک کار انتخاب کن.','bad');return}
  let planned=0;if(mode==='pomodoro')planned=phase==='break'?state.settings.timer.pomodoroBreak:state.settings.timer.pomodoroFocus;if(mode==='deep')planned=phase==='break'?state.settings.timer.deepBreak:state.settings.timer.deepFocus;
  state.activeTimer={id:uid('timer'),taskId,subtaskId:phase==='focus'?focusSubtaskId:'',mode,phase,plannedMinutes:planned,startedAt:nowIso(),createdAt:nowIso(),accumulatedSeconds:0,paused:false};save();render();
}
function pauseResumeTimer(){const a=state.activeTimer;if(!a)return;if(a.paused){a.startedAt=nowIso();a.paused=false}else{a.accumulatedSeconds=timerElapsedSeconds(a);a.paused=true}save();render()}
function recordFocusSession(a,natural=false){
  const sec=a.mode==='stopwatch'?timerElapsedSeconds(a):(natural?(Number(a.plannedMinutes)||0)*60:Math.min(timerElapsedSeconds(a),(Number(a.plannedMinutes)||0)*60));
  if(sec<1)return; state.focusSessions.push({id:uid('fs'),taskId:a.taskId,subtaskId:a.subtaskId||'',mode:a.mode,phase:'focus',startedAt:a.createdAt||a.startedAt,endedAt:nowIso(),plannedMinutes:Number(a.plannedMinutes)||0,durationSeconds:Math.round(sec),createdAt:nowIso()});
}
function finishTimer(manual=true){const a=state.activeTimer;if(!a)return;if(a.phase==='focus'){recordFocusSession(a,false);const breakMin=a.mode==='pomodoro'?state.settings.timer.pomodoroBreak:a.mode==='deep'?state.settings.timer.deepBreak:0;if(breakMin>0&&a.mode!=='stopwatch'){state.activeTimer={id:uid('timer'),taskId:'',subtaskId:'',mode:a.mode,phase:'break',plannedMinutes:breakMin,startedAt:nowIso(),createdAt:nowIso(),accumulatedSeconds:0,paused:true};notifyUser('جلسه تمرکز ثبت شد',`استراحت ${toFa(breakMin)} دقیقه‌ای آماده است.`)}else{state.activeTimer=null;notifyUser('جلسه تمرکز ثبت شد','زمان واقعی کار به‌روزرسانی شد.')}}else{state.activeTimer=null;notifyUser('استراحت پایان یافت','برای جلسه بعدی آماده‌ای.')}save();render()}
function completeTimerNaturally(){const a=state.activeTimer;if(!a||a.paused||a.mode==='stopwatch')return;if(a.phase==='focus'){recordFocusSession(a,true);const breakMin=a.mode==='pomodoro'?state.settings.timer.pomodoroBreak:state.settings.timer.deepBreak;state.activeTimer={id:uid('timer'),taskId:'',subtaskId:'',mode:a.mode,phase:'break',plannedMinutes:breakMin,startedAt:nowIso(),createdAt:nowIso(),accumulatedSeconds:0,paused:true};save();notifyUser('زمان تمرکز تمام شد',`جلسه ثبت شد. استراحت ${toFa(breakMin)} دقیقه‌ای آماده است.`);render()}else{state.activeTimer=null;save();notifyUser('استراحت تمام شد','می‌توانی جلسه تمرکز بعدی را شروع کنی.');render()}}

  async function cloudRequest(action,extra={}){

    try{
      const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ctrl.signal,redirect:'follow'});
      const raw=await res.text();let data;try{data=JSON.parse(raw)}catch{throw new Error('پاسخ سرویس قابل خواندن نیست. استقرار Apps Script را بررسی کن.')}if(!data.ok)throw new Error(data.error||'خطای سرویس ابری');return data;

  }

  function openModal(title,body,foot='',small=false){const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML=`<div class="modal ${small?'small':''}"><div class="modal-head"><h2>${title}</h2><button class="close">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div>`;document.body.appendChild(el);el.querySelector('.close').onclick=()=>el.remove();el.onclick=e=>{if(e.target===el)el.remove()};return el}

  function emojiField(name,value='',suggested=['💼','📚','🌿','🎯','📝','💡']){return `<div class="emoji-field"><div class="emoji-current"><input name="${name}" maxlength="8" value="${esc(value)}" placeholder="مثلاً 🎯"><button type="button" class="ghost-btn emoji-open" data-emoji-open="${name}">ایموجی‌ها</button></div><div class="emoji-suggestions">${suggested.map(e=>`<button type="button" class="emoji-btn" data-emoji-pick="${name}" data-emoji="${e}">${e}</button>`).join('')}</div><div class="emoji-panel hidden" data-emoji-panel="${name}"><div class="emoji-tabs">${Object.keys(EMOJIS).map((k,i)=>`<button type="button" class="emoji-tab ${i===0?'active':''}" data-emoji-tab="${name}" data-group="${k}">${k}</button>`).join('')}</div><div class="emoji-grid" data-emoji-grid="${name}">${EMOJIS['پیشنهادی'].map(e=>`<button type="button" data-emoji-pick="${name}" data-emoji="${e}">${e}</button>`).join('')}</div></div></div>`}
  function wireEmoji(root,name){
    const input=$(`[name="${name}"]`,root),panel=$(`[data-emoji-panel="${name}"]`,root);$(`[data-emoji-open="${name}"]`,root)?.addEventListener('click',()=>panel.classList.toggle('hidden'));
    root.addEventListener('click',e=>{const pick=e.target.closest(`[data-emoji-pick="${name}"]`);if(pick){input.value=pick.dataset.emoji;return}const tab=e.target.closest(`[data-emoji-tab="${name}"]`);if(tab){$$(`[data-emoji-tab="${name}"]`,root).forEach(x=>x.classList.remove('active'));tab.classList.add('active');$(`[data-emoji-grid="${name}"]`,root).innerHTML=EMOJIS[tab.dataset.group].map(em=>`<button type="button" data-emoji-pick="${name}" data-emoji="${em}">${em}</button>`).join('')}})
  }

  function openFileDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB unsupported'));const req=window.indexedDB.open(FILE_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(FILE_STORE))db.createObjectStore(FILE_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
  async function putFileBlob(id,blob){try{const db=await openFileDb();await new Promise((res,rej)=>{const tx=db.transaction(FILE_STORE,'readwrite');tx.objectStore(FILE_STORE).put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){toast('ذخیره فایل در این مرورگر ممکن نشد.','bad');throw e}}
  async function getFileBlob(id){const db=await openFileDb();const blob=await new Promise((res,rej)=>{const r=db.transaction(FILE_STORE,'readonly').objectStore(FILE_STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return blob}
  async function deleteFileBlob(id){try{const db=await openFileDb();await new Promise((res,rej)=>{const tx=db.transaction(FILE_STORE,'readwrite');tx.objectStore(FILE_STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch{}}
  function attachmentMeta(id){for(const t of state.tasks){const a=(t.attachments||[]).find(x=>x.id===id);if(a)return a}return null}
  async function driveAttachmentBlob(meta){
    if(!meta?.driveFileId||!googleTokenValid())return null;
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(meta.driveFileId)}?alt=media`,{headers:{Authorization:`Bearer ${googleAccessToken}`}});
    if(!r.ok)return null;
    return await r.blob();
  }

  async function shareAttachment(id){try{let blob=await getFileBlob(id),meta=attachmentMeta(id);if(!meta)throw 0;if(!blob){blob=await driveAttachmentBlob(meta);if(blob)await putFileBlob(id,blob)}if(!blob)throw 0;const file=new File([blob],meta.name,{type:meta.type||blob.type});if(navigator.canShare?.({files:[file]})){await navigator.share({title:meta.name,files:[file]});}else{toast('اشتراک مستقیم فایل در این مرورگر پشتیبانی نمی‌شود؛ فایل را دانلود کن.')}}catch(e){if(e?.name!=='AbortError')toast('اشتراک فایل انجام نشد.','bad')}}
  async function uploadAttachmentToGoogleDrive(id){try{if(!googleTokenValid())throw new Error('ابتدا حساب Google را از تنظیمات متصل کن.');const blob=await getFileBlob(id),meta=attachmentMeta(id);if(!blob||!meta)throw new Error('فایل محلی پیدا نشد.');const folder=await ensureDriveFolder();const f=await googleApi('https://www.googleapis.com/drive/v3/files?fields=id,webViewLink',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:meta.name,mimeType:meta.type||blob.type||'application/octet-stream',parents:[folder]})});await googleApi(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':meta.type||blob.type||'application/octet-stream'},body:blob});meta.driveFileId=f.id;meta.driveUrl=f.webViewLink||`https://drive.google.com/file/d/${f.id}/view`;meta.uploadedAt=nowIso();save({skipCloud:true});toast('فایل در Google Drive همین حساب ذخیره شد.','good')}catch(e){toast(e.message||'آپلود Drive ناموفق بود.','bad')}}

  function safeDriveName(v){return String(v||'بدون نام').replace(/[\\/:*?\"<>|]/g,'-').trim().slice(0,120)||'بدون نام'}
  function driveQ(v){return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
  async function driveFindChild(parentId,name,mimeType=''){
    const parts=[`name='${driveQ(name)}'`,`'${driveQ(parentId)}' in parents`,'trashed=false'];if(mimeType)parts.push(`mimeType='${driveQ(mimeType)}'`);

  }
  async function findDriveDataFile(){const g=googleCfg(),st=await ensureMyLifeDriveStructure();if(g.driveDataFileId)return {id:g.driveDataFileId,modifiedTime:g.driveDataModifiedTime||''};const f=await driveFindChild(st.sys.id,'mylife_state_v14.json','application/json');if(f){g.driveDataFileId=f.id;g.driveDataModifiedTime=f.modifiedTime||'';save({skipCloud:true,skipDrive:true})}return f||null}
  async function createJsonFile(name,parentId,data,props={}){const meta=await googleApi('https://www.googleapis.com/drive/v3/files?fields=id,name,webViewLink',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/json',parents:[parentId],appProperties:{app:'MyLife',...props}})});await googleApi(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(meta.id)}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data,null,2)});return meta}
  async function updateJsonFile(fileId,data){return googleApi(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fileId)}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data,null,2)})}
  syncStateToDrive=async function(silent=false){const g=googleCfg();if(activeProfileId==='guest'||!googleTokenValid())return false;try{const st=await ensureMyLifeDriveStructure();let f=await findDriveDataFile();state._cloudMeta={...(state._cloudMeta||{}),profileId:activeProfileId,updatedAt:nowIso(),appVersion:14};if(!f){f=await createJsonFile('mylife_state_v14.json',st.sys.id,state,{kind:'state',profile:activeProfileId});g.driveDataFileId=f.id}else await updateJsonFile(f.id,state);g.lastDriveDataSync=nowIso();g.lastSync=g.lastDriveDataSync;save({skipCloud:true,skipDrive:true});if(!silent){render();toast('داده‌ها در پوشه MyLife همین Google Drive ذخیره شد.','good')}return true}catch(e){if(!silent)toast(e.message||'ذخیره Drive ناموفق بود.','bad');return false}}
  restoreStateFromDrive=async function(ask=true){try{const f=await findDriveDataFile();if(!f){toast('هنوز فایل داده MyLife در Drive وجود ندارد.','bad');return false}if(ask&&!confirm('نسخه Drive جایگزین داده محلی شود؟'))return false;const r=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(f.id)}?alt=media`,{headers:{Authorization:`Bearer ${googleAccessToken}`}});if(!r.ok)throw new Error(`Drive ${r.status}`);const remote=await r.json();storageSet(backupKey(),JSON.stringify(state));state=migrateState(remote);const g=googleCfg();g.driveDataFileId=f.id;g.lastDriveDataSync=nowIso();save({skipCloud:true,skipDrive:true});render();toast('داده‌ها از Drive بازیابی شدند.','good');return true}catch(e){toast(e.message||'بازیابی Drive ناموفق بود.','bad');return false}}
  bootstrapDriveData=async function(hadLocal){try{await ensureMyLifeDriveStructure();const f=await findDriveDataFile();if(f&&!hadLocal){await restoreStateFromDrive(false);return}if(!f){await syncStateToDrive(true);return}toast('پوشه MyLife در Drive آماده است.','good')}catch(e){console.warn(e)}}
  ensureDriveFolder=async function(){const st=await ensureMyLifeDriveStructure();return st.root.id}

  async function ensureTaskDriveFolder(t){const st=await ensureMyLifeDriveStructure(),primary=taskPrimaryCategory(t)||{id:'none',name:'بدون دسته'},project=proj(t.projectId);const cFolder=await ensureNamedFolder(`${primary.icon||''} ${primary.name}`.trim(),st.root.id,{kind:'category',entityId:primary.id});const pFolder=await ensureNamedFolder(project?`${project.icon||''} ${project.name}`.trim():'بدون پروژه',cFolder.id,{kind:'project',entityId:project?.id||'none'});const tFolder=await ensureNamedFolder(t.title,pFolder.id,{kind:'task',entityId:t.id});const outFolder=await ensureNamedFolder('خروجی',tFolder.id,{kind:'output',entityId:t.id});t.driveFolderId=tFolder.id;t.driveOutputFolderId=outFolder.id;t.driveUrl=`https://drive.google.com/drive/folders/${tFolder.id}`;
    // Secondary categories contain shortcuts to the same physical task folder: no duplicated files/times.
    for(const cid of taskCategoryIds(t).filter(x=>x!==primary.id)){const c=cat(cid);if(!c)continue;const sc=await ensureNamedFolder(`${c.icon||''} ${c.name}`.trim(),st.root.id,{kind:'category',entityId:c.id});const sp=await ensureNamedFolder(project?`${project.icon||''} ${project.name}`.trim():'بدون پروژه',sc.id,{kind:'project-link',entityId:project?.id||'none'});const existing=await driveFindChild(sp.id,t.title,'application/vnd.google-apps.shortcut');if(!existing){try{await googleApi('https://www.googleapis.com/drive/v3/files?fields=id,name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:safeDriveName(t.title),mimeType:'application/vnd.google-apps.shortcut',parents:[sp.id],shortcutDetails:{targetId:tFolder.id},appProperties:{app:'MyLife',kind:'task-shortcut',entityId:t.id}})})}catch(e){console.warn('shortcut',e)}}}
    return {taskFolder:tFolder,outputFolder:outFolder}
  }
  async function syncDriveHierarchy(){if(!googleTokenValid()){toast('ابتدا Google را متصل کن.','bad');return}googleBusy=true;try{await ensureMyLifeDriveStructure();let n=0;for(const t of state.tasks.filter(x=>!x.archived)){await ensureTaskDriveFolder(t);n++}save({skipCloud:true,skipDrive:true});await syncStateToDrive(true);render();toast(`ساختار Drive برای ${toFa(n)} کار همگام شد.`, 'good')}catch(e){toast(e.message||'ساختار Drive ساخته نشد.','bad')}finally{googleBusy=false}}
  uploadAttachmentToGoogleDrive=async function(id){try{if(!googleTokenValid())throw new Error('ابتدا حساب Google را متصل کن.');const blob=await getFileBlob(id),meta=attachmentMeta(id);if(!blob||!meta)throw new Error('فایل محلی پیدا نشد.');const task=state.tasks.find(t=>(t.attachments||[]).some(a=>a.id===id));if(!task)throw new Error('کار مربوط به فایل پیدا نشد.');const folders=await ensureTaskDriveFolder(task);const f=await googleApi('https://www.googleapis.com/drive/v3/files?fields=id,webViewLink',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:meta.name,mimeType:meta.type||blob.type||'application/octet-stream',parents:[folders.outputFolder.id],appProperties:{app:'MyLife',kind:'output',taskId:task.id}})});await googleApi(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':meta.type||blob.type||'application/octet-stream'},body:blob});meta.driveFileId=f.id;meta.driveUrl=f.webViewLink||`https://drive.google.com/file/d/${f.id}/view`;meta.uploadedAt=nowIso();save({skipCloud:true});toast('فایل در مسیر دسته ← پروژه ← کار ← خروجی ذخیره شد.','good');render()}catch(e){toast(e.message||'آپلود Drive ناموفق بود.','bad')}}
  googleDriveBackup=async function(){try{const st=await ensureMyLifeDriveStructure(),backups=await ensureNamedFolder('Backups',st.sys.id,{kind:'backups'}),name=`backup_${localDateKey()}_${new Date().toTimeString().slice(0,5).replace(':','-')}.json`;await createJsonFile(name,backups.id,state,{kind:'backup'});googleCfg().lastBackup=nowIso();save({skipCloud:true,skipDrive:true});toast('Backup داخل MyLife/_System/Backups ساخته شد.','good')}catch(e){toast(e.message||'Backup Drive ناموفق بود.','bad')}}

  function reviewCode(fileId){return 'MLR1-'+btoa(fileId).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
  function reviewFileIdFromCode(code){try{let x=String(code||'').trim().replace(/^MLR1-/i,'').replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';return atob(x)}catch{return ''}}
  async function shareDriveFile(fileId,email,role='commenter'){return googleApi(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}/permissions?sendNotificationEmail=true&fields=id,emailAddress,role`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'user',role,emailAddress:email})})}
  function taskReviewSnapshot(t,email,rate){const sessions=(state.focusSessions||[]).filter(s=>s.taskId===t.id&&s.phase!=='break');const unique=new Map();sessions.forEach(s=>unique.set(s.id,s));const mins=[...unique.values()].reduce((a,s)=>a+(Number(s.durationSeconds)||0)/60,0)+(Number(t.manualActual)||0);const hourly=Number(rate)||Number(t.hourlyRate)||0;return {schema:'mylife-review-v1',createdAt:nowIso(),owner:{name:profileInfo().name,email:profileInfo().email},reviewerEmail:email,task:{id:t.id,title:t.title,description:t.description,outputSummary:t.outputSummary,completionNotes:t.completionNotes,categories:taskCategoryIds(t).map(id=>cat(id)?.name).filter(Boolean),primaryCategory:taskPrimaryCategory(t)?.name||'',project:proj(t.projectId)?.name||'',status:t.status,scheduledAt:t.scheduledAt,deadline:t.deadline,completedAt:t.completedAt},work:{sessions:[...unique.values()].map(s=>({id:s.id,startedAt:s.startedAt,endedAt:s.endedAt,durationSeconds:s.durationSeconds,mode:s.mode||s.type||'focus'})),totalMinutes:Math.round(mins),hourlyRate:hourly,amount:Math.round(mins/60*hourly)},outputs:(t.attachments||[]).filter(a=>a.driveFileId||a.driveUrl).map(a=>({name:a.name,url:a.driveUrl||`https://drive.google.com/file/d/${a.driveFileId}/view`,fileId:a.driveFileId||''})),driveTaskUrl:t.driveUrl||''}}
  async function createReviewerInvite(taskId,email,rate=0){const t=state.tasks.find(x=>x.id===taskId);if(!t)throw new Error('کار پیدا نشد.');if(!/^\S+@\S+\.\S+$/.test(email))throw new Error('ایمیل بازبین معتبر نیست.');const folders=await ensureTaskDriveFolder(t);for(const a of (t.attachments||[])){if(!a.driveFileId){try{await uploadAttachmentToGoogleDrive(a.id)}catch{}}if(a.driveFileId){try{await shareDriveFile(a.driveFileId,email,'reader')}catch(e){console.warn(e)}}}
    const snap=taskReviewSnapshot(t,email,rate),reviewFolder=await ensureNamedFolder('بازبینی',folders.taskFolder.id,{kind:'review',entityId:t.id}),file=await createJsonFile(`گزارش-کار-${safeDriveName(t.title)}.json`,reviewFolder.id,snap,{kind:'review-report',taskId:t.id});await shareDriveFile(file.id,email,'commenter');const code=reviewCode(file.id);state.reviewInvites=Array.isArray(state.reviewInvites)?state.reviewInvites:[];state.reviewInvites.push({id:uid('ri'),taskId:t.id,email,rate:Number(rate)||0,fileId:file.id,code,createdAt:nowIso(),active:true});save({skipDrive:true});await syncStateToDrive(true);return code}
  async function loadReviewByCode(code){const id=reviewFileIdFromCode(code);if(!id)throw new Error('کد گزارش معتبر نیست.');const r=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?alt=media`,{headers:{Authorization:`Bearer ${googleAccessToken}`}});if(!r.ok)throw new Error(r.status===404||r.status===403?'این گزارش برای حساب Google فعلی به اشتراک گذاشته نشده است.':'دریافت گزارش ناموفق بود.');return {id,data:await r.json()}}
  async function listReviewComments(fileId){const d=await googleApi(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}/comments?fields=comments(id,content,createdTime,resolved,author(displayName,photoLink,me))&pageSize=100`);return d.comments||[]}
  async function addReviewComment(fileId,content){return googleApi(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}/comments?fields=id,content,createdTime,author(displayName,me)`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})})}
  async function refreshOwnerInvite(inv){try{inv.comments=await listReviewComments(inv.fileId);inv.approved=inv.comments.some(c=>String(c.content||'').startsWith('[MYLIFE_APPROVED]'));inv.lastChecked=nowIso();save({skipDrive:true});render()}catch(e){toast(e.message||'خواندن نظرها ناموفق بود.','bad')}}
  let activeReviewPortal=null,activeReviewComments=[];
  function reviewCommentsHtml(comments=[]){return comments.length?comments.map(c=>`<div class="review-comment ${String(c.content||'').startsWith('[MYLIFE_APPROVED]')?'approved':''}"><b>${esc(c.author?.displayName||'کاربر')}</b><div>${esc(String(c.content||'').replace('[MYLIFE_APPROVED]','✅ تأیید:'))}</div><small>${c.createdTime?faDateTime(c.createdTime):''}</small></div>`).join(''):'<div class="analytics-empty">هنوز نظری ثبت نشده است.</div>'}
  function workReviewPage(){const invites=(state.reviewInvites||[]).filter(x=>x.active!==false),tasks=state.tasks.filter(t=>!t.archived),connected=googleTokenValid();return shell(`${pageHeader('گزارش کار و بازبینی','گزارش زنده روی Google Drive؛ بازبین فقط موردی را می‌بیند که ایمیلش روی همان فایل مجوز دارد.')}<div class="review-grid"><section class="card"><div class="card-head"><h2>اشتراک یک کار با کارفرما / بازبین</h2><span class="review-status ${connected?'ok':'warn'}">${connected?'Google متصل':'نیاز به Google'}</span></div><div class="card-body"><div class="drive-setup-box"><b>ساختار فایل‌ها در Drive</b><div class="drive-tree-preview">${esc(appName())}<br>↳ دسته اصلی<br>&nbsp;&nbsp;↳ پروژه<br>&nbsp;&nbsp;&nbsp;&nbsp;↳ کار<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;↳ خروجی<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;↳ بازبینی</div><p>اگر کار چند دسته داشته باشد فقط یک پوشه واقعی دارد و در دسته‌های ثانویه Shortcut ساخته می‌شود؛ بنابراین فایل و زمان دوباره‌شماری نمی‌شوند.</p></div><form id="reviewInviteForm" class="form-grid" style="margin-top:12px"><div class="field"><label>کار<select name="taskId" required><option value="">انتخاب…</option>${tasks.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></label></div><div class="field"><label>ایمیل کارفرما / بازبین<input name="email" type="email" dir="ltr" required placeholder="employer@example.com"></label></div><div class="field"><label>نرخ ساعتی (اختیاری)<input name="rate" type="number" min="0" step="1000" placeholder="مثلاً 500000"></label></div><div class="field" style="align-content:end"><button class="primary-btn" ${connected?'':'disabled'}>ساخت دسترسی و کد</button></div></form><div style="margin-top:10px"><button class="ghost-btn" id="syncDriveTree" ${connected?'':'disabled'}>همگام‌سازی کل ساختار Drive</button> ${!connected?'<button class="primary-btn" id="reviewConnectGoogle">اتصال Google</button>':''}</div></div></section><aside class="card"><div class="card-head"><h2>ورود بازبین با کد</h2></div><div class="card-body reviewer-portal"><p>کدی که صاحب کار داده را وارد کن. کد فقط شناسه گزارش است؛ امنیت واقعی با حساب Google و مجوز همان فایل در Drive کنترل می‌شود.</p><input id="reviewCodeInput" dir="ltr" placeholder="MLR1-..."><button class="primary-btn" id="openReviewCode">باز کردن گزارش</button>${activeReviewPortal?`<hr><h3>${esc(activeReviewPortal.data.task?.title||'گزارش کار')}</h3><div class="portal-summary"><div><span>زمان</span><b>${fmtMin(activeReviewPortal.data.work?.totalMinutes||0)}</b></div><div><span>نرخ ساعتی</span><b>${toFa(activeReviewPortal.data.work?.hourlyRate||0)}</b></div><div><span>مبلغ</span><b>${toFa(activeReviewPortal.data.work?.amount||0)}</b></div><div><span>وضعیت</span><b>${esc(statusFa(activeReviewPortal.data.task?.status||''))}</b></div></div><p>${esc(activeReviewPortal.data.task?.description||'')}</p><div class="output-links">${(activeReviewPortal.data.outputs||[]).map(o=>`<a class="output-link" target="_blank" rel="noopener" href="${esc(o.url)}"><span>📎 ${esc(o.name)}</span><b>مشاهده</b></a>`).join('')||'<span class="form-note">خروجی قابل اشتراکی ثبت نشده است.</span>'}</div><textarea id="reviewCommentText" placeholder="نظر، اصلاح موردنیاز یا توضیح..."></textarea><div class="actions"><button class="primary-btn" id="sendReviewComment">ثبت نظر</button><button class="ghost-btn" id="approveReview">✓ تأیید کارکرد</button></div><div class="review-comments">${reviewCommentsHtml(activeReviewComments)}</div>`:''}</div></aside></div><section class="card" style="margin-top:14px"><div class="card-head"><h2>دسترسی‌های ایجادشده</h2></div><div class="card-body"><div class="review-list">${invites.length?invites.map(inv=>{const t=state.tasks.find(x=>x.id===inv.taskId);return `<div class="review-item"><div class="review-item-head"><div><b>${esc(t?.title||'کار حذف‌شده')}</b><div class="review-meta"><span>${esc(inv.email)}</span><span>${inv.approved?'✅ تأیید شده':'در انتظار تأیید'}</span><span>${inv.comments?.length?toFa(inv.comments.length)+' نظر':'بدون نظر'}</span></div></div><span class="review-status ${inv.approved?'ok':'warn'}">${inv.approved?'تأیید':'فعال'}</span></div><div style="margin-top:8px"><span class="review-code">${esc(inv.code)}</span></div><div class="actions" style="margin-top:8px"><button class="mini-btn" data-copy-review="${inv.id}">کپی کد</button><button class="mini-btn" data-refresh-review="${inv.id}">دریافت نظرها</button><a class="mini-btn" target="_blank" rel="noopener" href="https://drive.google.com/file/d/${encodeURIComponent(inv.fileId)}/view">Drive</a></div>${inv.comments?.length?`<div class="review-comments">${reviewCommentsHtml(inv.comments)}</div>`:''}</div>`}).join(''):'<div class="analytics-empty">هنوز دسترسی بازبینی ساخته نشده است.</div>'}</div></div></section>`)}
  document.addEventListener('submit',async e=>{if(e.target?.id!=='reviewInviteForm')return;e.preventDefault();const fd=new FormData(e.target);try{const code=await createReviewerInvite(String(fd.get('taskId')),String(fd.get('email')).trim(),Number(fd.get('rate'))||0);render();try{await navigator.clipboard.writeText(code)}catch{}toast('دسترسی ساخته شد و کد آماده اشتراک است.','good')}catch(err){toast(err.message||'ساخت دسترسی ناموفق بود.','bad')}});
  document.addEventListener('click',async e=>{const x=e.target.closest('[data-copy-review]');if(x){const inv=(state.reviewInvites||[]).find(i=>i.id===x.dataset.copyReview);if(inv){try{await navigator.clipboard.writeText(inv.code);toast('کد کپی شد.','good')}catch{prompt('کد دسترسی:',inv.code)}}return}const r=e.target.closest('[data-refresh-review]');if(r){const inv=(state.reviewInvites||[]).find(i=>i.id===r.dataset.refreshReview);if(inv)await refreshOwnerInvite(inv);return}if(e.target?.id==='syncDriveTree'){await syncDriveHierarchy();return}if(e.target?.id==='reviewConnectGoogle'){await connectGoogleAccount();route='workreview';render();return}if(e.target?.id==='openReviewCode'){try{if(!googleTokenValid())await connectGoogleAccount();const code=$('#reviewCodeInput')?.value||'';activeReviewPortal=await loadReviewByCode(code);activeReviewComments=await listReviewComments(activeReviewPortal.id);render()}catch(err){toast(err.message||'گزارش باز نشد.','bad')}return}if(e.target?.id==='sendReviewComment'){const txt=$('#reviewCommentText')?.value.trim();if(!txt||!activeReviewPortal)return;try{await addReviewComment(activeReviewPortal.id,txt);activeReviewComments=await listReviewComments(activeReviewPortal.id);render();toast('نظر ثبت شد.','good')}catch(err){toast(err.message||'ثبت نظر ناموفق بود.','bad')}return}if(e.target?.id==='approveReview'){if(!activeReviewPortal)return;try{await addReviewComment(activeReviewPortal.id,'[MYLIFE_APPROVED] کارکرد و گزارش مشاهده و تأیید شد.');activeReviewComments=await listReviewComments(activeReviewPortal.id);render();toast('تأیید ثبت شد.','good')}catch(err){toast(err.message||'ثبت تأیید ناموفق بود.','bad')}return}});

  if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
  window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();route='search';render();requestAnimationFrame(()=>$('#globalSearch')?.focus())}if(e.key==='Escape')$('.modal-backdrop')?.remove()});
  setInterval(timerTick,500);
  setInterval(checkReminders,30000);
  try{
    render();
    if(!storagePersistent){
      setTimeout(()=>toast('نسخه پیش‌نمایش اجرا شد؛ برای ذخیره دائمی داده‌ها فایل را در مرورگر معمولی باز کن.',''),600);
    }
    setTimeout(checkReminders,1200);
    setTimeout(ensurePrayerTimes,800);
    setTimeout(()=>hydrateFromIndexedDb(),250);
  }catch(err){
    console.error('MyLife startup error',err);
    const app=document.getElementById('app');
    if(app)app.innerHTML=`<div dir="rtl" style="max-width:720px;margin:60px auto;padding:24px;border:1px solid #e6e8f0;border-radius:18px;font-family:'MyBKoodak',sans-serif;background:#fff"><h2 style="margin-top:0">MyLife نتوانست کامل بارگذاری شود</h2><p>یک خطای اجرای مرورگر رخ داده است. صفحه را یک‌بار Refresh کن. اگر ادامه داشت، نسخه ZIP را در مرورگر معمولی اجرا کن.</p><pre style="white-space:pre-wrap;background:#f6f6fa;padding:12px;border-radius:10px">${String(err?.message||err)}</pre></div>`;
  }
})();

</script>
